<!doctype html>
<html lang="en" class="dark" style="color-scheme: dark;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>TradersWorld</title>
    <meta name="description" content="The accountability platform for serious traders. Find your partner, log your sessions, stay consistent." />
    <meta name="author" content="TradersWorld" />

    <link rel="icon" type="image/png" href="/favicon.png?v=3" />
    <link rel="apple-touch-icon" href="/favicon.png?v=3" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.png?v=3" />
    <link rel="apple-touch-icon" sizes="192x192" href="/favicon.png?v=3" />
    <link rel="apple-touch-icon" sizes="512x512" href="/favicon.png?v=3" />

    <!-- PWA / Add to Home Screen -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0B0F0E" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TradersWorld" />

    <!-- Globe image is loaded on demand by Landing/Auth pages only (no global preload) -->

    <meta property="og:title" content="TradersWorld" />
    <meta property="og:description" content="The accountability platform for serious traders." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tradersworld.app" />
    <meta property="og:image" content="https://tradersworld.app/og-image.jpg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@tradersworld" />
    <meta name="twitter:title" content="TradersWorld" />
    <meta name="twitter:description" content="The accountability platform for serious traders." />
    <meta name="twitter:image" content="https://tradersworld.app/og-image.jpg" />

    <link rel="canonical" href="https://tradersworld.app" />
  </head>

  <body>
    <style>
      #initial-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: #0B0F0E;
        color: #E5E7EB;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        transition: opacity 250ms ease;
      }
      #initial-splash.splash-hide { opacity: 0; pointer-events: none; }
      #initial-splash .splash-logo {
        width: 88px;
        height: 88px;
        border-radius: 20px;
        background: #0B0F0E url("/app-icon-192.png") center / cover no-repeat;
        box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      }
      #initial-splash .splash-spinner {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 2px solid rgba(255,255,255,0.15);
        border-top-color: #22c55e;
        animation: splash-spin 0.8s linear infinite;
      }
      #initial-splash .splash-name {
        font-size: 15px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #9CA3AF;
      }
      @keyframes splash-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        #initial-splash .splash-spinner { animation: none; }
      }
    </style>
    <div id="initial-splash" aria-hidden="true">
      <div class="splash-logo"></div>
      <div class="splash-name">TradersWorld</div>
      <div class="splash-spinner"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
